<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أنت مناسب لأنهي كومتي في همسة؟</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5e8;--card:#ffffff;--ink:#2a1b08;--mute:#6b5a43;--line:#e6d9bd;--pri:#6e420b;--on-pri:#ffffff;--acc:#d9a21b;--no:#f1e8d3;--sup:#2a7a74;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d05;--card:#21160a;--ink:#f6ecd8;--mute:#c2af8e;--line:#3d2b15;--pri:#e0a823;--on-pri:#1a1005;--acc:#e0a823;--no:#33230f;--sup:#5fc2b8}}
:root[data-theme="dark"]{--bg:#140d05;--card:#21160a;--ink:#f6ecd8;--mute:#c2af8e;--line:#3d2b15;--pri:#e0a823;--on-pri:#1a1005;--acc:#e0a823;--no:#33230f;--sup:#5fc2b8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
h1{font-size:1.7rem;line-height:1.35;margin:0 0 10px;font-weight:800}
p{margin:0 0 14px;color:var(--mute)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:1.1rem}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--pri);color:var(--on-pri);width:100%}
.part{display:inline-block;font-weight:600;font-size:.9rem;padding:2px 12px;border-radius:99px;background:var(--acc);color:#2a2000;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.q{font-size:1.35rem;font-weight:600;line-height:1.6;min-height:5.5em;margin:0 0 18px;color:var(--ink)}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.ans button{padding:14px 4px}
.yes{background:var(--pri);color:var(--on-pri)}
.no{background:var(--no);color:var(--ink)}.mid{background:var(--no);color:var(--ink);box-shadow:inset 0 0 0 2px var(--acc)}
.cnt{font-size:.9rem;color:var(--mute)}
.res{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;background:var(--card)}
.res small{color:var(--mute);font-weight:600}
.res h2{margin:2px 0 2px;font-size:1.5rem;font-weight:800}
.res .pct{font-size:2.4rem;font-weight:800;color:var(--pri);line-height:1.2}
.res.s .pct{color:var(--sup)}
.res .bar{margin:8px 0 10px}
.res.s .bar i{background:var(--sup)}
.res p{margin:0}
details{margin:6px 0 16px;color:var(--mute)}
summary{cursor:pointer;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.logo{display:block;width:92px;height:92px;border-radius:50%;margin:4px auto 16px;box-shadow:0 0 0 3px var(--acc)}
</style>
</head>

SCOME:["SCOME","التعليم الطبي"],SCOPH:["SCOPH","الصحة العامة"],SCORA:["SCORA","الصحة الإنجابية والإيدز"],SCORP:["SCORP","حقوق الإنسان والسلام"],
FSD:["FSD","التمويل والرعاة"],CBSD:["CBSD","تطوير المهارات"],PSD:["PSD","إدارة المشاريع"],RSD:["RSD","البحث العلمي"],PNSD:["PNSD","الميديا والتصميم"]};
var DATA={
std:{
SCOME:["تحب تناقش طرق التدريس في كليتك وتفكر إزاي تتحسن؟","تحب تنظم ورش أو جلسات مراجعة لزمايلك؟","مهتم تعرف نظام الدراسة الطبية في دول تانية؟","تحب تشرح مادة علمية لحد أصغر منك؟","تحب تشارك باقتراحات لإدارة الكلية عن المنهج؟"],
SCOPH:["تقدر تنزل شارع أو قرية وتوعّي ناس عن مرض أو عادة صحية؟","مهتم بقضايا زي التدخين والتغذية والأمراض المزمنة؟","تحب تشتغل في حملات قياس ضغط وسكر للناس؟","تحب تقرأ عن الأوبئة وإزاي المجتمعات بتتعامل معاها؟","تحب تنظم حملة عن موضوع صحي وتشوف أثرها بنفسك؟"],
SCORA:["تقدر تتكلم بشكل علمي ومحترم في مواضيع الصحة الإنجابية؟","مهتم بالتوعية عن الأمراض المنقولة والإيدز؟","تحب تشتغل على تصحيح المفاهيم الغلط المنتشرة في المجتمع؟","تحب تدرّب زمايلك على التوعية بالأقران؟","تحب تشتغل في قضايا صحة المرأة وتنظيم الأسرة؟"],
SCORP:["مهتم بحقوق المرضى والعدالة في الوصول للعلاج؟","تحب تتناقش في قضايا إنسانية زي اللاجئين والصحة وقت النزاعات؟","تحب تنظم فعاليات عن التنوع وقبول الاختلاف؟","بتتأثر لما تشوف حد اتظلم وتحب تعمل حاجة؟","تحب تتعلم عن القانون الدولي الإنساني وأخلاقيات الطب؟"]},
sup:{
FSD:["تحب تتواصل مع شركات ومؤسسات علشان تطلب دعم؟","عندك استعداد تتعرض لرفض وتكمل من غير ما تتضايق؟","تحب تنظم بازارات أو أنشطة لجمع التبرعات؟","تحب تعمل ميزانية وتتابع مصروفات فعالية؟","تحب تكتب عرض (proposal) تقنع بيه راعي؟"],
CBSD:["تحب تقف قدام ناس وتشرح مهارة زي العرض أو الـ CV؟","مهتم تطور مهاراتك زي القيادة وإدارة الوقت؟","تحب تصمم ورشة أو تدريب بنفسك؟","تحب تعمل ألعاب وأنشطة تفاعلية تعلّم حاجة؟","بتحب تساعد زمايلك يتطوروا في مهاراتهم؟"],
PSD:["تحب تخطط فعالية من الفكرة لحد التنفيذ؟","تحب تقسّم المهام على فريق وتتابع كل واحد؟","بتحب تعمل جداول زمنية وتلتزم بيها؟","بتعرف تتصرف بهدوء لما خطة تتغير فجأة؟","تحب تراجع بعد أي فعالية إيه نجح وإيه لأ؟"],
RSD:["تحب تقرأ أبحاث علمية وتحللها؟","مهتم تشارك في عمل بحث أو دراسة من الصفر؟","عندك صبر على جمع البيانات وتنظيمها؟","تحب تتعلم الإحصاء أو برامج تحليل البيانات؟","تحب تساعد زمايلك في كتابة أبحاثهم أو نشرها؟"],
PNSD:["تحب تصمم بوستات أو لوجوهات على Canva أو Photoshop؟","تحب تعمل مونتاج فيديو أو ريلز؟","بتلاحظ تفاصيل الألوان والخطوط وتفرق بين تصميم حلو وعادي؟","تحب تصوّر الفعاليات وتوثقها؟","تحب تكتب كابشنز ومحتوى جذاب للسوشيال ميديا؟"]}};
var PARTS=[["std","الجزء الأول: Standard"],["sup","الجزء التاني: Supporting"]];
var $=function(i){return document.getElementById(i)};
var MAIN=3,list=[],idx=0,score={},asked={},ext={};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
 list=[];score={};asked={};ext={};
 PARTS.forEach(function(p){
  var qs=[];
  Object.keys(DATA[p[0]]).forEach(function(c){score[c]=0;DATA[p[0]][c].slice(0,MAIN).forEach(function(t){qs.push({c:c,t:t,p:p})})});
  list=list.concat(shuffle(qs));
 });
 idx=0;
}
function show(id){["intro","quiz","result"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}
function ask(){
 var q=list[idx];
 $("part").textContent=q.p[1];
 $("cnt").textContent=q.x?"سؤال إضافي علشان نحسم النتيجة 🎯":"سؤال "+(idx+1)+" من "+list.length;
 $("fill").style.width=(idx/list.length*100)+"%";
 $("q").textContent=q.t;
}
function answer(v){
 var c=list[idx].c;score[c]+=v;asked[c]=(asked[c]||0)+1;
 idx++;
 if(idx>=list.length){finish()}else{ask()}
}
function pct(k){return Math.round(score[k]/(2*asked[k])*100)}
function topOf(group){
 var max=-1,w=[];
 Object.keys(DATA[group]).forEach(function(k){var v=score[k]/asked[k];if(v>max+1e-9){max=v;w=[k]}else if(Math.abs(v-max)<1e-9){w.push(k)}});
 return {w:w,pct:Math.round(max/2*100)};
}
function finish(){
 var add=[];
 PARTS.forEach(function(p){var g=p[0];if(ext[g])return;ext[g]=true;var t=topOf(g);if(t.w.length>1&&t.pct>0){t.w.forEach(function(k){DATA[g][k].slice(MAIN).forEach(function(q){add.push({c:k,t:q,p:p,x:1})})})}});
 if(add.length){list=list.concat(shuffle(add));ask();return}
 var h="";
 [["std","Standard",""],["sup","Supporting","s"]].forEach(function(g){
  var t=topOf(g[0]);
  var names=t.w.map(function(k){return INFO[k][0]}).join(" و ");
  var desc=t.w.map(function(k){return INFO[k][1]}).join(" / ");
  var note=t.w.length>1?"نتيجتك متعادلة، يعني ينفع تدخل أكتر من كومتي 😄":"أنت الأقرب للكومتي دي.";
  h+='<div class="res '+g[2]+'"><small>'+g[1]+'</small><h2>'+names+'</h2><div class="pct">'+t.pct+'%</div><div class="bar"><i style="width:'+t.pct+'%"></i></div><p>'+desc+'. '+note+'</p></div>';
 });
 $("out").innerHTML=h;
 var a="";
 Object.keys(score).forEach(function(k){a+='<div class="row"><span>'+INFO[k][0]+' ('+INFO[k][1]+')</span><b>'+pct(k)+'%</b></div>'});
 $("all").innerHTML=a;
 show("result");
}
$("start").onclick=function(){build();ask();show("quiz")};
$("y").onclick=function(){answer(2)};
$("m").onclick=function(){answer(1)};
$("n").onclick=function(){answer(0)};
$("again").onclick=function(){show("intro")};
</script>
</body>
</html>
